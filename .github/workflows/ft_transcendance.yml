name: CI - Processes & Docker

on:
  pull_request:
    branches: [ main, "feature/*", develop ]
  push:
    branches: [ main, "feature/*", develop ]

jobs:
  # 1. Proceso de compilación de Rust (rápido, sin construir imagen)
  rust-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Compile check workspace
        working-directory: ./backend
        run: cargo check --workspace --all-targets

  # 2. Proceso de build + smoke test de la imagen Docker del backend
  backend-docker:
    runs-on: ubuntu-latest
    needs: rust-compile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          load: true
          tags: music-room-backend:test
          cache-from: type=gha,scope=backend-img
          cache-to: type=gha,mode=max,scope=backend-img

      - name: Smoke test backend with MariaDB
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ft_transcendence
          MYSQL_USER: rmarrero
          MYSQL_PASSWORD: "12345"
        run: |
          docker network create ci-backend-net

          docker run -d --name ci-mariadb --network ci-backend-net \
            -e MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            -e MYSQL_DATABASE="$MYSQL_DATABASE" \
            -e MYSQL_USER="$MYSQL_USER" \
            -e MYSQL_PASSWORD="$MYSQL_PASSWORD" \
            mariadb:latest

          for i in $(seq 1 30); do
            if docker exec ci-mariadb mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" -p"$MYSQL_PASSWORD" --silent; then
              break
            fi
            sleep 2
          done

          docker run -d --name ci-backend --network ci-backend-net \
            -e APP_ENV=test \
            -e SERVER_HOST=0.0.0.0 \
            -e SERVER_PORT=3000 \
            -e DATABASE_URL="mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@ci-mariadb:3306/${MYSQL_DATABASE}" \
            music-room-backend:test

          sleep 3
          docker logs ci-backend
          docker run --rm --network ci-backend-net curlimages/curl:latest \
            -fsS http://ci-backend:3000/api/health | grep -q '"ok"'

  # 3. Proceso de compilación de Next.js (independiente del backend)
  nextjs-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Typegen & build Next.js
        run: |
          if [ ! -d "frontend" ]; then
            echo "Carpeta ./frontend aún no existe; omitiendo build de Next.js."
            exit 0
          fi
          cd ../frontend
          npm ci
          npx next typegen
          npm run build

  # 4. Proceso de build + smoke test de la imagen Docker del frontend
  frontend-docker:
    runs-on: ubuntu-latest
    needs: nextjs-compile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          tags: music-room-frontend:test
          cache-from: type=gha,scope=frontend-img
          cache-to: type=gha,mode=max,scope=frontend-img

      - name: Smoke test frontend container
        run: |
          if ! docker image inspect music-room-frontend:test >/dev/null 2>&1; then
            echo "Imagen music-room-frontend:test no construida; omitiendo smoke test."
            exit 0
          fi
          docker run -d --name ci-frontend -p 8080:80 music-room-frontend:test
          sleep 2
          docker logs ci-frontend
          curl -fsS http://127.0.0.1:8080/ | grep -qiE "<!doctype html|<html|root"